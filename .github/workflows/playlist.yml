name: Check and publish Kodi playlist

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_playlist.py
      - .github/workflows/playlist.yml

concurrency:
  group: github-pages-playlist

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Download the currently published playlists
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          for file in playlist.m3u stremio.m3u; do
            status=$(curl --silent --show-error --location --max-time 15 \
              "${PAGES_URL%/}/$file?check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output "$RUNNER_TEMP/$file" --write-out '%{http_code}')
            case "$status" in
              200) ;;
              404) rm -f "$RUNNER_TEMP/$file" ;;
              *) echo "Could not load $file (HTTP $status)." >&2; exit 1 ;;
            esac
          done
      - name: Discover and verify the Kodi streams
        id: kodi
        run: |
          mkdir -p public
          if ! python3 update_playlist.py public/playlist.m3u "$RUNNER_TEMP/playlist.m3u"; then
            echo 'outage=true' >> "$GITHUB_OUTPUT"
            if [ ! -f public/playlist.m3u ]; then
              cp "$RUNNER_TEMP/playlist.m3u" public/playlist.m3u
            fi
          fi
      - name: Discover and verify the Stremio streams
        run: |
          python3 update_playlist.py --stremio public/stremio.m3u "$RUNNER_TEMP/stremio.m3u" || \
            cp "$RUNNER_TEMP/stremio.m3u" public/stremio.m3u
      - name: Check if either published playlist changed
        id: compare
        run: |
          if cmp -s public/playlist.m3u "$RUNNER_TEMP/playlist.m3u" && \
             cmp -s public/stremio.m3u "$RUNNER_TEMP/stremio.m3u"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Both published playlists are current.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload playlists
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy playlists
        if: steps.compare.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report an unresolved Kodi outage
        if: steps.kodi.outputs.outage == 'true'
        run: |
          echo 'A Kodi channel failed checks against both providers. See the stream check logs.' >&2
          exit 1
