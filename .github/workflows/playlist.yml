name: Check and publish Kodi playlist

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-playlist

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Resolve and verify both streams
        run: python3 update_playlist.py public/playlist.m3u
      - name: Check if the published playlist changed
        id: compare
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if curl --fail --silent --show-error --location --max-time 15 \
              "${PAGES_URL%/}/playlist.m3u?check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output "$RUNNER_TEMP/published.m3u" && \
              cmp -s public/playlist.m3u "$RUNNER_TEMP/published.m3u"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Both streams are playable. Published playlist is current.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload playlist
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy playlist
        if: steps.compare.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
